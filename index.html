<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Marvel Cinematic Universe | Watch & Download</title>
    <meta name="description" content="Watch and download your favorite Marvel movies in stunning high quality." />
    <meta name="theme-color" content="#060608" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Intro Loading Video -->
    <div id="intro-overlay" class="intro-overlay">
      <div class="video-container">
        <video id="intro-video" autoplay muted playsinline webkit-playsinline preload="auto" disablePictureInPicture>
          <source src="./starting_video_for_mobile_web.mp4" type="video/mp4" media="(max-width: 768px)">
          <source src="./new_opening_marvel_video_web.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <button id="skip-intro" class="skip-btn" aria-label="Skip Intro">Skip Intro ➔</button>
      </div>
    </div>

    <!-- Main Application -->
    <div id="app">
      <!-- Background Ambient Glow & Cosmic Canvas -->
      <canvas id="cosmic-canvas"></canvas>
      <div class="ambient-glow orb-1"></div>
      <div class="ambient-glow orb-2"></div>
      <div class="ambient-glow orb-3"></div>

      <header class="header">
        <div class="header-inner">
          <a href="#" class="logo" aria-label="Marvel Movies Home">
            <span class="marvel-box">MARVEL</span>
            <span class="studios-text">MOVIES</span>
          </a>
          <div class="header-search">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="movie-search" placeholder="Search Marvel movies..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
            <button id="clear-search" class="clear-search-btn hidden" aria-label="Clear search">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
          <nav class="nav">
            <a href="#featured" class="active">All Movies</a>
          </nav>
      </header>
      
      <main class="main-content">
        <section class="hero">
          <video id="hero-video" loop muted playsinline webkit-playsinline preload="none" disablePictureInPicture class="hero-video">
            <source src="./new_one_header_video_web.mp4" type="video/mp4">
          </video>
          <div class="hero-overlay"></div>
        </section>

        <section class="movies-section" id="featured">
          <div class="section-header">
            <div class="section-title-wrap">
              <h2>MARVEL CINEMATIC UNIVERSE</h2>
              <span id="movies-count" class="movies-count-badge">37 Titles</span>
            </div>
            <div class="phase-filters" id="phase-filters" role="tablist" aria-label="Filter movies by Marvel phase">
              <button class="filter-chip active" data-phase="all">All Phases</button>
              <button class="filter-chip" data-phase="1">Phase 1</button>
              <button class="filter-chip" data-phase="2">Phase 2</button>
              <button class="filter-chip" data-phase="3">Phase 3</button>
              <button class="filter-chip" data-phase="4">Phase 4</button>
              <button class="filter-chip" data-phase="5">Phase 5</button>
              <button class="filter-chip" data-phase="6">Phase 6</button>
            </div>
          </div>
          
          <div id="movies-grid" class="movies-grid">
            <!-- Movies dynamically injected here -->
          </div>
          <div id="no-results" class="no-results hidden">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
            <p>No Marvel movies found matching your search.</p>
            <button id="reset-filter-btn" class="btn btn-secondary">Show All Movies</button>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="footer-logo">
          <span class="marvel-box">MARVEL</span>
          <span class="studios-text">MOVIES</span>
        </div>
        <p>&copy; 2026 MCU Fan Hub. High quality streaming & downloads archive.</p>
      </footer>

      <!-- Scroll to Top Button -->
      <button id="scroll-top-btn" class="scroll-top-btn" aria-label="Scroll to top">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
      </button>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
